[package]
name = "sapling-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tokio I/O for sapling: RakNet and NetherNet listeners, login driver, inbox and outbox"

[features]
default = ["online"]
# Fetching the login issuer's signing keys over HTTPS (reqwest).
online = ["acacia-auth/online"]

[dependencies]
acacia-auth.workspace = true
acacia-nethernet.workspace = true
acacia-proto.workspace = true
acacia-raknet.workspace = true
acacia-session.workspace = true
bytes.workspace = true
p384.workspace = true
rand_core.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
acacia-client.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }