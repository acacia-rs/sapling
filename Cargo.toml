[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# A BDS script pack and its runner, no crate.
exclude = ["tools/map-colours"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
sapling-api = { path = "crates/sapling-api" }
sapling-data = { path = "crates/sapling-data" }
sapling-leveldb = { path = "crates/sapling-leveldb" }
sapling-macros = { path = "crates/sapling-macros" }
sapling-net = { path = "crates/sapling-net", default-features = false }
sapling-shard = { path = "crates/sapling-shard" }
sapling-world = { path = "crates/sapling-world" }
sapling-worldgen = { path = "crates/sapling-worldgen" }

# acacia at one commit of its `master`: bump every `rev` together. To build against a checkout
# beside this one instead, see docs/DESIGN.md "Building against a local acacia".
acacia-auth = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f", default-features = false }
acacia-molang = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-physics = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f", features = ["acacia-world"] }
acacia-nethernet = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-proto = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-raknet = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-session = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-world = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
# Test clients and the recorded BDS join (dev-dependencies only).
acacia-bot = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-client = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }
acacia-testserver = { git = "https://github.com/acacia-rs/acacia", rev = "37036096e815f7526b9a145e6873767d93ea9c2f" }

base64 = "0.22"
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
bytes = "1.12.1"
flate2 = "1.1"
# The bedrock-crustaceans fork: Send + Sync, background compaction (research/worlds-and-ecs.md §2).
# Never enable its `zstd` feature: it would claim compression id 2, which is zlib in worlds.
rusty-leveldb = { git = "https://github.com/bedrock-crustaceans/rusty-leveldb", rev = "3365b32b747ad50fefdd8b6a6f988dacf357a114", default-features = false, features = ["fs"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# The console's line editor (tab completion on a terminal).
rustyline = { version = "15", default-features = false }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros", "sync"] }
# HTTPS NetherNet signaling; ring, as reqwest's rustls already builds.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = "1"

# testbox's disk is the build bottleneck: full debuginfo made every linked test binary hundreds of MB.
[profile.dev]
debug = "line-tables-only"

# Login crypto is ~100x slower unoptimised; debug servers would answer the handshake seconds late.
[profile.dev.package]
"*" = { debug = false }
p384 = { opt-level = 3 }
primeorder = { opt-level = 3 }
elliptic-curve = { opt-level = 3 }
ecdsa = { opt-level = 3 }
# Light floods are ~6 µs a cell unoptimised: joining a few loaded columns held a debug tick 150 ms.
sapling-world = { opt-level = 2 }
acacia-world = { opt-level = 2 }
crypto-bigint = { opt-level = 3 }
sha2 = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
rsa = { opt-level = 3 }
num-bigint-dig = { opt-level = 3 }
