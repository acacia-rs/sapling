[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
sapling-api = { path = "crates/sapling-api" }
sapling-data = { path = "crates/sapling-data" }
sapling-leveldb = { path = "crates/sapling-leveldb" }
sapling-macros = { path = "crates/sapling-macros" }
sapling-net = { path = "crates/sapling-net", default-features = false }
sapling-shard = { path = "crates/sapling-shard" }
sapling-world = { path = "crates/sapling-world" }
sapling-worldgen = { path = "crates/sapling-worldgen" }

# acacia at one commit of its `master`: bump every `rev` together. To build against a checkout
# beside this one instead, see docs/DESIGN.md "Building against a local acacia".
acacia-auth = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f", default-features = false }
acacia-molang = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-physics = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f", features = ["acacia-world"] }
acacia-nethernet = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-proto = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-raknet = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-session = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-world = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
# Test clients and the recorded BDS join (dev-dependencies only).
acacia-bot = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-client = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }
acacia-testserver = { git = "https://github.com/acacia-rs/acacia", rev = "01304e9b8eab883b6d0d2279ebf5dd7b9de3692f" }

base64 = "0.22"
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bytes = "1.12.1"
flate2 = "1.1"
# The bedrock-crustaceans fork: Send + Sync, background compaction (research/worlds-and-ecs.md §2).
# Never enable its `zstd` feature: it would claim compression id 2, which is zlib in worlds.
rusty-leveldb = { git = "https://github.com/bedrock-crustaceans/rusty-leveldb", rev = "3365b32b747ad50fefdd8b6a6f988dacf357a114", default-features = false, features = ["fs"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = "1"

# Login crypto is ~100x slower unoptimised; debug servers would answer the handshake seconds late.
[profile.dev.package]
p384 = { opt-level = 3 }
primeorder = { opt-level = 3 }
elliptic-curve = { opt-level = 3 }
ecdsa = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
sha2 = { opt-level = 3 }
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
rsa = { opt-level = 3 }
num-bigint-dig = { opt-level = 3 }
